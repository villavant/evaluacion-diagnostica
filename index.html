<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>Evaluación Diagnóstica de Programación — Maestría en Ciencia de Datos e IA | UTEC Posgrado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="assets/logo-utec-posgrado-color.svg">
<style>
  /* Identidad visual UTEC Posgrado: Space Grotesk, cian #00E1FF, carbón #1E1C1D */
  :root{
    --ink:#1E1C1D;
    --black:#050505;
    --graphite:#4E4B4C;
    --cyan:#00E1FF;
    --cyan-deep:#00A9C2;
    --cyan-tint:#E5FCFF;
    --bg:#F8F8F8;
    --card:#FFFFFF;
    --text:#1E1C1D;
    --muted:#6B6869;
    --border:#E4E4E4;
    --danger:#C62828;
    --radius:4px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.55;
    padding-bottom:env(safe-area-inset-bottom,0px);
  }

  /* ---------- Header ---------- */
  header.top{background:var(--black);color:#fff;padding-top:env(safe-area-inset-top,0px);position:sticky;top:0;z-index:10;}
  header.top .inner{max-width:880px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
  header.top .logo{height:40px;width:auto;display:block;}
  header.top .step{font-size:13px;color:#A3A2A2;text-align:right;line-height:1.3;}
  header.top .step strong{display:block;color:#fff;font-weight:600;font-size:14px;}
  .progress-outer{height:3px;background:#2B2B2B;}
  .progress-inner{height:100%;background:var(--cyan);width:0%;transition:width .35s ease;}

  /* ---------- Hero ---------- */
  .hero{background:var(--ink);color:#fff;position:relative;overflow:hidden;}
  .hero::before,.hero::after{content:"";position:absolute;background:var(--cyan);transform:skewY(-28deg);}
  .hero::before{right:-40px;top:-30px;width:110px;height:220px;opacity:.9;}
  .hero::after{right:90px;top:40px;width:36px;height:140px;opacity:.35;}
  .hero .inner{max-width:880px;margin:0 auto;padding:34px 20px 38px;position:relative;z-index:1;}
  .hero .eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);margin:0 0 10px;}
  .hero h1{font-size:clamp(26px,5vw,40px);line-height:1.1;font-weight:700;margin:0;color:#fff;max-width:620px;letter-spacing:-.01em;}

  .wrap{max-width:880px;margin:0 auto;padding:0 20px 60px;}
  #app{max-width:760px;}

  /* ---------- Cards y texto ---------- */
  .card{background:var(--card);border-radius:var(--radius);padding:32px 30px;margin-top:28px;border:1px solid var(--border);border-top:4px solid var(--cyan);}
  h1{font-size:28px;line-height:1.15;margin:0 0 12px;color:var(--ink);font-weight:700;letter-spacing:-.01em;}
  h2{font-size:22px;line-height:1.2;margin:0 0 14px;color:var(--ink);font-weight:700;}
  p{margin:0 0 14px;color:var(--text);}
  .muted{color:var(--muted);font-size:14.5px;}
  code{font-family:"JetBrains Mono",Consolas,monospace;font-size:.9em;background:var(--cyan-tint);padding:1px 5px;border-radius:2px;}
  .pill{display:inline-block;background:var(--ink);color:#fff;font-size:12.5px;font-weight:500;padding:5px 12px;border-radius:2px;}
  .pill::before{content:"";display:inline-block;width:6px;height:6px;background:var(--cyan);margin-right:8px;vertical-align:middle;transform:skewY(-28deg);}
  .hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 20px;}

  /* ---------- Formularios ---------- */
  label.field-label{display:block;font-weight:600;font-size:14px;margin:0 0 6px;color:var(--ink);}
  input[type="text"], input[type="email"], select{
    width:100%;padding:12px 14px;border:1px solid #CFCFCF;border-radius:var(--radius);font-size:15px;
    font-family:inherit;background:#fff;color:var(--text);margin-bottom:20px;
  }
  input:focus, select:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(0,225,255,.35);}

  .check-row{display:flex;align-items:flex-start;gap:12px;background:var(--cyan-tint);border-left:4px solid var(--cyan);padding:16px;margin:20px 0;}
  .check-row input{margin-top:3px;width:18px;height:18px;flex:none;accent-color:var(--ink);}
  .check-row label{font-size:14px;color:var(--ink);}

  /* ---------- Preguntas ---------- */
  .q-block{border-top:1px solid var(--border);padding-top:22px;margin-top:22px;}
  .q-block:first-child{border-top:none;padding-top:0;margin-top:0;}
  .q-index{font-size:12px;font-weight:600;color:var(--graphite);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
  .q-text{font-size:16.5px;font-weight:600;margin-bottom:12px;color:var(--ink);}
  pre.code{
    background:var(--ink);color:#E8E8E8;padding:14px 16px;border-radius:var(--radius);font-size:13.5px;
    overflow-x:auto;margin:0 0 14px;font-family:"JetBrains Mono",Consolas,Menlo,monospace;line-height:1.6;
    border-left:4px solid var(--cyan);
  }
  .opts{display:flex;flex-direction:column;gap:8px;}
  .opt{
    display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:var(--radius);
    padding:12px 14px;cursor:pointer;font-size:15px;transition:border-color .15s,background .15s,box-shadow .15s;background:#fff;
  }
  .opt:hover{border-color:var(--ink);}
  .opt.selected{border-color:var(--ink);background:var(--cyan-tint);box-shadow:inset 4px 0 0 var(--cyan);}
  .opt input{margin:0;width:17px;height:17px;flex:none;accent-color:var(--ink);}

  .story{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:18px;font-size:14.5px;white-space:pre-wrap;word-break:break-word;}
  .story.mono{font-family:"JetBrains Mono",Consolas,Menlo,monospace;font-size:13px;line-height:1.75;}

  /* ---------- Botones ---------- */
  .nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:28px;gap:12px;}
  button{
    font-family:inherit;font-size:15px;font-weight:600;padding:13px 26px;border-radius:var(--radius);border:none;cursor:pointer;
    transition:background .15s,color .15s,border-color .15s;
  }
  button.primary{background:var(--cyan);color:var(--black);}
  button.primary::after{content:" →";}
  button.primary:hover{background:var(--black);color:var(--cyan);}
  button.primary:disabled{background:#D7D7D7;color:#8A8A8A;cursor:not-allowed;}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink);}
  button.ghost:hover{background:var(--ink);color:#fff;}
  button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px;}
  .err{color:var(--danger);font-size:13.5px;margin-top:8px;display:none;}
  .err.show{display:block;}

  .confirm-box{text-align:center;padding:48px 24px;}
  .confirm-box .icon{font-size:52px;margin-bottom:12px;}
  .score-total{font-size:20px;font-weight:600;color:var(--muted);margin:22px 0 18px;}
  .score-total span{font-size:64px;font-weight:700;color:var(--ink);line-height:1;letter-spacing:-.02em;}
  .score-rows{text-align:left;max-width:460px;margin:0 auto 24px;display:flex;flex-direction:column;gap:12px;}
  .score-row{display:grid;grid-template-columns:1fr 90px 48px;align-items:center;gap:12px;font-size:14px;}
  .score-row strong{text-align:right;}
  .score-bar{height:8px;background:var(--border);}
  .score-bar div{height:100%;background:var(--cyan);}
  @media (max-width:560px){.score-row{grid-template-columns:1fr 48px;}.score-bar{grid-column:1/-1;grid-row:2;}}

  /* ---------- Footer ---------- */
  footer.foot{background:var(--black);color:#A3A2A2;font-size:13px;margin-top:40px;}
  footer.foot .inner{max-width:880px;margin:0 auto;padding:28px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
  footer.foot img{height:34px;width:auto;}
  footer.foot p{margin:0;color:#A3A2A2;flex:1;min-width:220px;}

  @media (max-width:560px){
    header.top .logo{height:32px;}
    header.top .step strong{font-size:13px;}
    .card{padding:24px 18px;margin-top:20px;}
    .hero .inner{padding:26px 56px 30px 20px;}
    .hero::before{width:56px;right:-28px;}
    .hero::after{display:none;}
    button{padding:12px 20px;}
  }
</style>
</head>

<script>
/* =========================================================================
   CONFIGURACIÓN — lo único que la coordinación debe editar
   ========================================================================= */
// Proyecto de Supabase que califica y guarda los envíos (función
// enviar_evaluacion). La clave publicable es pública por diseño: solo permite
// llamar esa función, no leer resultados ni la clave de respuestas.
const SUPABASE_URL = "https://blgcpoqhrjuvllmgwhhx.supabase.co";
const SUPABASE_KEY = "sb_publishable_EXXR3IpFmc7ksMDjmOhitA_TYRrsUZg";

/* ========================================================================= */

const DATA = JSON.parse(document.getElementById('exam-data').textContent);

const state = {
  nombre: "",
  email: "",
  lenguaje: "",
  experiencia: "",
  integridad: false,
  respuestasI: new Array(DATA.preguntas.length).fill(null),
  respuestasReto1: {},   // { r1a: idx, r1b: idx, r1c: idx }
  respuestaReto2: null,
  step: 0,
};

// --- construcción de pasos ---
// Paso 0: portada + integridad
// Paso 1: datos del postulante
// Pasos 2..5: Parte I en bloques de 5 preguntas (20 -> 4 bloques)
// Paso 6: Reto 1
// Paso 7: Reto 2
// Paso 8: confirmación / envío

const BLOQUES_PARTE1 = chunk(DATA.preguntas.map((p, i) => i), 5); // [[0..4],[5..9],[10..14],[15..19]]
const TOTAL_STEPS = 2 + BLOQUES_PARTE1.length + 2 + 1;

function chunk(arr, n) {
  const out = [];
  for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n));
  return out;
}

const app = document.getElementById('app');
const progressBar = document.getElementById('progressBar');
const progressLabel = document.getElementById('progressLabel');

function updateProgress() {
  const pct = Math.round((state.step / (TOTAL_STEPS - 1)) * 100);
  progressBar.style.width = pct + '%';
  progressLabel.textContent = `Paso ${state.step + 1} de ${TOTAL_STEPS}`;
}

function render() {
  updateProgress();
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  if (state.step === 0) return renderPortada();
  if (state.step === 1) return renderDatos();
  const bloqueIdx = state.step - 2;
  if (bloqueIdx >= 0 && bloqueIdx < BLOQUES_PARTE1.length) return renderParteI(bloqueIdx);
  if (state.step === 2 + BLOQUES_PARTE1.length) return renderReto1();
  if (state.step === 2 + BLOQUES_PARTE1.length + 1) return renderReto2();
  return renderEnvio();
}

function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

/* ---------------- Paso 0: Portada ---------------- */
function renderPortada() {
  app.innerHTML = '';
  const card = el(`
    <div class="card">
      <h2>Antes de empezar</h2>
      <p>Este diagnóstico ayuda a la coordinación de la Maestría en Ciencia de Datos e Inteligencia Artificial a conocer tu nivel actual de programación. No requiere instalar nada.</p>
      <div class="hero-meta">
        <span class="pill">~45 minutos</span>
        <span class="pill">24 preguntas</span>
        <span class="pill">Cualquier lenguaje de programación</span>
      </div>
      <p class="muted">La mayor parte se responde marcando una opción. En dos ejercicios cortos deberás escribir y ejecutar un programa (en el lenguaje que prefieras, o en un compilador en línea) y luego indicar aquí el resultado que obtuviste.</p>
      <div class="check-row">
        <input type="checkbox" id="chkIntegridad">
        <label for="chkIntegridad">Confirmo que resolveré esta evaluación por mi cuenta, <strong>sin apoyo de internet ni de herramientas de inteligencia artificial generativa</strong> (buscadores, asistentes de IA, generadores de código, etc.).</label>
      </div>
      <div class="err" id="errPortada">Marca la casilla para continuar.</div>
      <div class="nav-row" style="justify-content:flex-end;">
        <button class="primary" id="btnStart">Comenzar</button>
      </div>
    </div>
  `);
  app.appendChild(card);
  const chk = card.querySelector('#chkIntegridad');
  chk.checked = state.integridad;
  card.querySelector('#btnStart').addEventListener('click', () => {
    if (!chk.checked) { card.querySelector('#errPortada').classList.add('show'); return; }
    state.integridad = true;
    state.step = 1;
    render();
  });
}

/* ---------------- Paso 1: Datos del postulante ---------------- */
function renderDatos() {
  app.innerHTML = '';
  const card = el(`
    <div class="card">
      <h2>Datos del postulante</h2>
      <label class="field-label">Nombres y apellidos completos</label>
      <input type="text" id="inpNombre" placeholder="Tu nombre completo" autocomplete="name">
      <label class="field-label">Correo electrónico</label>
      <input type="email" id="inpEmail" placeholder="tucorreo@ejemplo.com" autocomplete="email">
      <label class="field-label">Lenguaje de programación con el que resolverás los ejercicios cortos</label>
      <select id="selLenguaje">
        <option value="">Selecciona una opción</option>
        <option>Python</option><option>Java</option><option>JavaScript / TypeScript</option>
        <option>C / C++</option><option>C#</option><option>R</option><option>SQL</option><option>Otro</option>
      </select>
      <label class="field-label">Experiencia programando (aproximada)</label>
      <select id="selExperiencia">
        <option value="">Selecciona una opción</option>
        <option>Menos de 1 año</option><option>De 1 a 3 años</option>
        <option>De 3 a 5 años</option><option>Más de 5 años</option>
      </select>
      <div class="err" id="errDatos">Completa todos los campos para continuar.</div>
      <div class="err" id="errEmail">Ingresa un correo electrónico válido.</div>
      <div class="nav-row">
        <button class="ghost" id="btnBack">Atrás</button>
        <button class="primary" id="btnNext">Continuar</button>
      </div>
    </div>
  `);
  app.appendChild(card);
  card.querySelector('#inpNombre').value = state.nombre;
  card.querySelector('#inpEmail').value = state.email;
  card.querySelector('#selLenguaje').value = state.lenguaje;
  card.querySelector('#selExperiencia').value = state.experiencia;

  card.querySelector('#btnBack').addEventListener('click', () => { state.step = 0; render(); });
  card.querySelector('#btnNext').addEventListener('click', () => {
    const nombre = card.querySelector('#inpNombre').value.trim();
    const lenguaje = card.querySelector('#selLenguaje').value;
    const experiencia = card.querySelector('#selExperiencia').value;
    const email = card.querySelector('#inpEmail').value.trim().toLowerCase();
    card.querySelector('#errDatos').classList.remove('show');
    card.querySelector('#errEmail').classList.remove('show');
    if (!nombre || !email || !lenguaje || !experiencia) { card.querySelector('#errDatos').classList.add('show'); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { card.querySelector('#errEmail').classList.add('show'); return; }
    state.nombre = nombre; state.email = email; state.lenguaje = lenguaje; state.experiencia = experiencia;
    state.step = 2; render();
  });
}

/* ---------------- Pasos 2..5: Parte I ---------------- */
function renderParteI(bloqueIdx) {
  app.innerHTML = '';
  const idxs = BLOQUES_PARTE1[bloqueIdx];
  const card = el(`
    <div class="card">
      <h2>Parte I — Selección múltiple (bloque ${bloqueIdx + 1} de ${BLOQUES_PARTE1.length})</h2>
      <p class="muted">Cada pregunta tiene una sola respuesta correcta. El pseudocódigo usa índices desde 0 y "//" para la división entera.</p>
      <div id="qContainer"></div>
      <div class="err" id="errBloque">Responde todas las preguntas de este bloque para continuar.</div>
      <div class="nav-row">
        <button class="ghost" id="btnBack">Atrás</button>
        <button class="primary" id="btnNext">Continuar</button>
      </div>
    </div>
  `);
  const qc = card.querySelector('#qContainer');
  idxs.forEach((qi) => {
    const p = DATA.preguntas[qi];
    const block = el(`
      <div class="q-block">
        <div class="q-index">Pregunta ${qi + 1} de ${DATA.preguntas.length} · ${p.tema}</div>
        <div class="q-text">${escapeHtml(p.q)}</div>
        ${p.code ? `<pre class="code">${escapeHtml(p.code)}</pre>` : ''}
        <div class="opts" data-qi="${qi}"></div>
      </div>
    `);
    const optsWrap = block.querySelector('.opts');
    p.opts.forEach((optText, oi) => {
      const opt = el(`
        <label class="opt">
          <input type="radio" name="q${qi}" value="${oi}">
          <span>${escapeHtml(optText)}</span>
        </label>
      `);
      if (state.respuestasI[qi] === oi) { opt.classList.add('selected'); opt.querySelector('input').checked = true; }
      opt.addEventListener('click', () => {
        state.respuestasI[qi] = oi;
        optsWrap.querySelectorAll('.opt').forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
      });
      optsWrap.appendChild(opt);
    });
    qc.appendChild(block);
  });
  app.appendChild(card);

  card.querySelector('#btnBack').addEventListener('click', () => { state.step -= 1; render(); });
  card.querySelector('#btnNext').addEventListener('click', () => {
    const ok = idxs.every(qi => state.respuestasI[qi] !== null);
    if (!ok) { card.querySelector('#errBloque').classList.add('show'); return; }
    state.step += 1; render();
  });
}

/* ---------------- Paso 6: Reto 1 ---------------- */
function renderReto1() {
  app.innerHTML = '';
  const card = el(`
    <div class="card">
      <h2>Parte II — Reto 1: Palabra más frecuente</h2>
      <p>Programa una solución que cuente cuántas veces aparece cada palabra del siguiente texto, <strong>sin distinguir mayúsculas de minúsculas</strong> (por ejemplo, "Datos", "DATOS" y "datos" cuentan como la misma palabra). Las palabras están separadas por un espacio. Ejecuta tu programa con este texto exacto y responde con el resultado que obtengas.</p>
      <div class="story mono">${escapeHtml(DATA.reto1_texto)}</div>
      <div id="r1Container"></div>
      <div class="err" id="errReto1">Responde las tres preguntas para continuar.</div>
      <div class="nav-row">
        <button class="ghost" id="btnBack">Atrás</button>
        <button class="primary" id="btnNext">Continuar</button>
      </div>
    </div>
  `);
  const c = card.querySelector('#r1Container');
  DATA.reto1_preguntas.forEach((rp) => {
    const block = el(`
      <div class="q-block">
        <div class="q-text">${escapeHtml(rp.label)}</div>
        <div class="opts"></div>
      </div>
    `);
    const optsWrap = block.querySelector('.opts');
    rp.opts.forEach((optText, oi) => {
      const opt = el(`<label class="opt"><input type="radio" name="${rp.id}" value="${oi}"><span>${escapeHtml(optText)}</span></label>`);
      if (state.respuestasReto1[rp.id] === oi) { opt.classList.add('selected'); opt.querySelector('input').checked = true; }
      opt.addEventListener('click', () => {
        state.respuestasReto1[rp.id] = oi;
        optsWrap.querySelectorAll('.opt').forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
      });
      optsWrap.appendChild(opt);
    });
    c.appendChild(block);
  });
  app.appendChild(card);
  card.querySelector('#btnBack').addEventListener('click', () => { state.step -= 1; render(); });
  card.querySelector('#btnNext').addEventListener('click', () => {
    const ok = DATA.reto1_preguntas.every(rp => state.respuestasReto1[rp.id] !== undefined);
    if (!ok) { card.querySelector('#errReto1').classList.add('show'); return; }
    state.step += 1; render();
  });
}

/* ---------------- Paso 7: Reto 2 ---------------- */
function renderReto2() {
  app.innerHTML = '';
  const listado = DATA.reto2_cadenas.map((c, i) => `${i + 1}) ${c}`).join('\n');
  const card = el(`
    <div class="card">
      <h2>Parte II — Reto 2: Paréntesis balanceados</h2>
      <p>Una cadena de paréntesis está <strong>balanceada</strong> si cada "(" se cierra con un ")" posterior y en ningún punto del recorrido hay más ")" que "(" hasta ese momento. Por ejemplo, "(()())" está balanceada, pero "())(" no lo está aunque tenga la misma cantidad de "(" y ")".</p>
      <p>Programa una solución y aplícala a estas 8 cadenas:</p>
      <div class="story mono">${escapeHtml(listado)}</div>
      <div class="q-block" style="border-top:none;padding-top:0;margin-top:0;">
        <div class="q-text">${escapeHtml(DATA.reto2_pregunta.label)}</div>
        <div class="opts" id="r2opts"></div>
      </div>
      <div class="err" id="errReto2">Selecciona una respuesta para continuar.</div>
      <div class="nav-row">
        <button class="ghost" id="btnBack">Atrás</button>
        <button class="primary" id="btnNext">Continuar</button>
      </div>
    </div>
  `);
  const optsWrap = card.querySelector('#r2opts');
  DATA.reto2_pregunta.opts.forEach((optText, oi) => {
    const opt = el(`<label class="opt"><input type="radio" name="r2a" value="${oi}"><span>${escapeHtml(optText)}</span></label>`);
    if (state.respuestaReto2 === oi) { opt.classList.add('selected'); opt.querySelector('input').checked = true; }
    opt.addEventListener('click', () => {
      state.respuestaReto2 = oi;
      optsWrap.querySelectorAll('.opt').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
    });
    optsWrap.appendChild(opt);
  });
  app.appendChild(card);
  card.querySelector('#btnBack').addEventListener('click', () => { state.step -= 1; render(); });
  card.querySelector('#btnNext').addEventListener('click', () => {
    if (state.respuestaReto2 === null) { card.querySelector('#errReto2').classList.add('show'); return; }
    state.step += 1; render();
    enviar();
  });
}

/* ---------------- Paso final: envío ---------------- */
// El puntaje se calcula solo en el servidor (backend_admin.gs); la clave de
// respuestas no se incluye en esta página.

function renderEnvio() {
  app.innerHTML = '';
  const card = el(`
    <div class="card confirm-box" id="confirmCard">
      <div class="icon">⏳</div>
      <h2>Enviando tus respuestas…</h2>
      <p class="muted">Un momento por favor.</p>
    </div>
  `);
  app.appendChild(card);
}

async function enviar() {
  const payload = {
    nombre: state.nombre,
    email: state.email,
    lenguaje: state.lenguaje,
    experiencia: state.experiencia,
    respuestasParteI: state.respuestasI,
    respuestasReto1: state.respuestasReto1,
    respuestaReto2: state.respuestaReto2,
  };

  const card = document.getElementById('confirmCard');
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/enviar_evaluacion`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY },
      body: JSON.stringify({ p: payload }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const r = await res.json();
    const fila = (label, pts, max) => `
      <div class="score-row">
        <span>${label}</span>
        <div class="score-bar"><div style="width:${Math.round((pts / max) * 100)}%"></div></div>
        <strong>${pts}/${max}</strong>
      </div>`;
    card.innerHTML = `
      <div class="icon">✅</div>
      <h2>Gracias, ${escapeHtml(state.nombre.split(' ')[0] || '')}</h2>
      <p>Tu evaluación diagnóstica fue registrada correctamente.</p>
      <div class="score-total"><span>${r.total}</span>/100</div>
      <div class="score-rows">
        ${fila('Parte I · Selección múltiple', r.parte1, 80)}
        ${fila('Reto 1 · Palabra más frecuente', r.reto1, 15)}
        ${fila('Reto 2 · Paréntesis balanceados', r.reto2, 5)}
      </div>
      <p class="muted">La coordinación de la maestría revisará los resultados como parte de tu proceso de postulación.</p>
    `;
  } catch (err) {
    card.innerHTML = `
      <div class="icon">⚠️</div>
      <h2>No se pudo registrar tu envío</h2>
      <p>Ocurrió un problema de conexión. Por favor, avisa a la coordinación de la maestría indicando tu nombre y la hora aproximada de este intento.</p>
    `;
  }
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

render();

</script>
